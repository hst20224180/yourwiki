  :root {

// Kana → Hepburn romaji, for Japanese place names that are not in the list.
const KANA = { きゃ: 'kya', きゅ: 'kyu', きょ: 'kyo', しゃ: 'sha', しゅ: 'shu', しょ: 'sho', ちゃ: 'cha', ちゅ: 'chu', ちょ: 'cho', にゃ: 'nya', にゅ: 'nyu', にょ: 'nyo',

  ば: 'ba', び: 'bi', ぶ: 'bu', べ: 'be', ぼ: 'bo', ぱ: 'pa', ぴ: 'pi', ぷ: 'pu', ぺ: 'pe', ぽ: 'po', ぁ: 'a', ぃ: 'i', ぅ: 'u', ぇ: 'e', ぉ: 'o' };
function kanaToRomaji(text) {
  const h = text.replace(/[\u30a1-\u30f6]/g, (ch) => String.fromCharCode(ch.charCodeAt(0) - 0x60));
  let out = '';
  for (let i = 0; i < h.length; i += 1) {
    const two = h.slice(i, i + 2);
    if (h[i] === 'っ') { const next = KANA[h.slice(i + 1, i + 3)] || KANA[h[i + 1]] || ''; out += next.startsWith('ch') ? 't' : next.charAt(0); continue; }
    if (h[i] === 'ー') continue;
    if (KANA[two]) { out += KANA[two]; i += 1; continue; }
    out += KANA[h[i]] ?? h[i];
  }
  return out.replace(/ou/g, 'o').replace(/uu/g, 'u').replace(/n(?=[bmp])/g, 'm').replace(/(^|\s)([a-z])/g, (m, sp, c) => sp + c.toUpperCase());
}

const hasJapanese = (t) => /[\u3040-\u30ff\u3400-\u9fff]/.test(t);
const isKanaOnly = (t) => /^[\u3040-\u30ff\s]+$/.test(t);
// A single lowercase word ("aomori", "lyon") is capitalised; phrases ("a small port town") are left as typed.
const titleCase = (t) => (/^[a-z][a-z'.-]*$/.test(t) ? t.charAt(0).toUpperCase() + t.slice(1) : t);

// One part of a birthplace ("Akita", "秋田県", "sandiego") → { en, ja }.
function placePart(raw) {
  const t = raw.trim();
  if (!t) return { en: '', ja: '' };
  if (hasJapanese(t)) {
    const found = PLACE_BY_JA.get(t) || PLACE_BY_JA.get(t.replace(/[都道府県市区町村]$/, ''));
    if (found) return { en: found[0], ja: t };
    if (!isKanaOnly(t)) return { en: t, ja: t };
    const romaji = kanaToRomaji(t);
    const byReading = PLACE_BY_KEY.get(placeKey(romaji));
    return { en: byReading && !/^[\u30a0-\u30ff]+$/.test(t) ? byReading[0] : romaji, ja: t };
  }
  const bare = t.replace(/[\s-]+(prefecture|city|ken|shi)$/i, '');
  const found = PLACE_BY_KEY.get(placeKey(t)) || PLACE_BY_KEY.get(placeKey(bare));
  if (found) return { en: found[0], ja: found[1] };
  return { en: titleCase(t), ja: t };
}

// A whole birthplace: comma-separated parts are converted one by one ("akita, japan" → "Akita, Japan" / "秋田、日本").
function placeNames(text) {
  const parts = text.split(/[,、，]/).map(placePart).filter((p) => p.en || p.ja);
  if (!parts.length) return { en: '', ja: '' };
  return { en: parts.map((p) => p.en).join(', '), ja: parts.map((p) => p.ja).join('、') };
}

/* ---------- fur: the body is painted strand by strand on a canvas ---------- */
// The SVG body shapes are read back as canvas paths. Each lump (a cloud bump, a poop tier, an ear) grows its own fur
// outward from its centre, so lumps read as separate soft masses. Strands near a lump's middle point at the viewer and
// look short; strands near its edge lie flat and look long, and the ones on the rim stick out past the silhouette.
const FUR_CACHE = new Map();
const FUR_PX = 3; // canvas pixels per drawing unit (the drawing is 120 units square)

function seededRandom(text) {
  let h = 2166136261;
  for (const ch of text) h = Math.imul(h ^ ch.charCodeAt(0), 16777619);
  return () => { h = Math.imul(h ^ (h >>> 15), 2246822507); h = Math.imul(h ^ (h >>> 13), 3266489909); h ^= h >>> 16; return (h >>> 0) / 4294967296; };
}
const hexRgb = (hex) => [1, 3, 5].map((i) => parseInt(hex.slice(i, i + 2), 16));

// Turn the shape's SVG markup into canvas paths with a centre and radius for each piece.
function furPieces(markup) {
  const doc = new DOMParser().parseFromString(`<svg xmlns="http://www.w3.org/2000/svg">${markup}</svg>`, 'image/svg+xml');
  const pieces = [];
  for (const el of doc.documentElement.children) {
    const n = (k) => parseFloat(el.getAttribute(k) || '0');
    const fill = el.getAttribute('fill') || '';
    const kind = fill === 'BODY' ? 'body' : fill === 'SHADE' ? 'inner' : el.getAttribute('opacity') && fill.startsWith('#') ? 'cast' : fill.startsWith('url') ? 'skip' : 'body';
    if (kind === 'skip') continue;
    const path = new Path2D();
    let cx, cy, rx, ry, box;
    if (el.tagName === 'circle') { cx = n('cx'); cy = n('cy'); rx = ry = n('r'); path.arc(cx, cy, rx, 0, Math.PI * 2); }
    else if (el.tagName === 'ellipse') {
      cx = n('cx'); cy = n('cy'); rx = n('rx'); ry = n('ry');
      const rot = /rotate\(([-\d.]+)/.exec(el.getAttribute('transform') || '');
      path.ellipse(cx, cy, rx, ry, rot ? parseFloat(rot[1]) * Math.PI / 180 : 0, 0, Math.PI * 2);
    } else if (el.tagName === 'rect') {
      const x = n('x'), y = n('y'), w = n('width'), h = n('height');
      path.roundRect(x, y, w, h, n('rx')); cx = x + w / 2; cy = y + h / 2; rx = w / 2; ry = h / 2;
    } else if (el.tagName === 'path') {
      const d = el.getAttribute('d');
      path.addPath(new Path2D(d));
      const nums = d.match(/-?\d*\.?\d+/g).map(Number);
      const xs = nums.filter((_, i) => i % 2 === 0), ys = nums.filter((_, i) => i % 2 === 1);
      const [x0, x1, y0, y1] = [Math.min(...xs), Math.max(...xs), Math.min(...ys), Math.max(...ys)];
      cx = (x0 + x1) / 2; cy = (y0 + y1) / 2 + (y1 - y0) * 0.08; rx = (x1 - x0) / 2; ry = (y1 - y0) / 2;
      box = { x0, x1, y0, y1 }; // fur grows from slightly below the middle, but is sampled over the whole shape
      if (el.getAttribute('stroke')) path.addPath(new Path2D(d)); // the stroke only rounds corners; the fur hides it
    } else continue;
    const flat = el.getAttribute('data-flat') === '1';
    box = box || { x0: cx - rx, x1: cx + rx, y0: cy - ry, y1: cy + ry };
    pieces.push({ kind, path, cx, cy, rx, ry, flat, box });
  }
  return pieces;
}

function furPng(shape, color) {
  const key = `${shape.id}|${color.id}`;
  if (FUR_CACHE.has(key)) return FUR_CACHE.get(key);
  const S = 120 * FUR_PX;
  const canvas = document.createElement('canvas');
  canvas.width = S; canvas.height = S;
  const ctx = canvas.getContext('2d');
  const rand = seededRandom(key);
  // Drawn in layout space (turned to the viewer's right), mirrored onto the canvas so the figure faces left.
  ctx.setTransform(-FUR_PX, 0, 0, FUR_PX, S, 0);
  const pieces = furPieces(shape.body({ fill: 'BODY', shade: 'SHADE' }));
  const bodies = pieces.filter((p) => p.kind === 'body');
  const base = hexRgb(color.fill);
  const light = { x: 70, y: shape.fy - 22 }; // light from the front, slightly above (layout space)
  const inside = (p, x, y) => ctx.isPointInPath(p.path, x * -FUR_PX + S, y * FUR_PX);
  const tone = (x, y) => {
    // Bright near the light, darker toward the far side and the bottom (a soft ball, not a flat disc).
    const d = Math.hypot(x - light.x, (y - light.y) * 1.1) / 52;
    const bottom = Math.max(0, (y - 88) / 14);
    return 1.28 - d * 0.62 - bottom * 0.28;
  };
  const rgba = (f, a, rgb = base) => {
    const c = rgb.map((v) => (f >= 1 ? v + (255 - v) * Math.min(1, (f - 1) * (color.dark ? 0.9 : 1.15)) : v * Math.max(0, f)));
    return `rgba(${c.map((v) => Math.round(Math.min(255, v))).join(',')},${a})`;
  };

  pieces.forEach((p, idx) => {
    if (p.kind === 'cast') {
      // A soft shadow that the lump above throws on the one below.
      const g = ctx.createRadialGradient(p.cx, p.cy, 0, p.cx, p.cy, p.rx);
      g.addColorStop(0, 'rgba(40,24,30,.72)'); g.addColorStop(.55, 'rgba(40,24,30,.32)'); g.addColorStop(1, 'rgba(40,24,30,0)');
      ctx.save(); ctx.translate(p.cx, p.cy); ctx.scale(1, p.ry / p.rx * 2.2); ctx.translate(-p.cx, -p.cy);
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(p.cx, p.cy, p.rx, 0, Math.PI * 2); ctx.fill(); ctx.restore();
      return;
    }
    const inner = p.kind === 'inner';
    const rgb = inner ? hexRgb(mixHex(color.fill, '#ff8fa0', 0.3)) : base;
    // Undercoat: a darker fill so gaps between strands read as depth.
    ctx.fillStyle = rgba(inner ? 0.78 : 0.72, 1, rgb);
    ctx.fill(p.path);
    const R = Math.max(p.rx, p.ry);
    const count = Math.round((p.box.x1 - p.box.x0) * (p.box.y1 - p.box.y0) / 4 * (inner ? 6 : 13));
    for (let i = 0; i < count; i += 1) {
      const x = p.box.x0 - 0.5 + rand() * (p.box.x1 - p.box.x0 + 1), y = p.box.y0 - 0.5 + rand() * (p.box.y1 - p.box.y0 + 1);
      if (!inside(p, x, y)) continue;
      const dx = x - p.cx, dy = y - p.cy;
      const dist = Math.min(1, Math.hypot(dx / p.rx, dy / p.ry));
      let ang = Math.atan2(dy, dx) + (rand() - 0.5) * 0.6;
      ang += Math.sin(ang - Math.PI / 2) * -0.25; // fur droops a little under its own weight
      const len = (inner ? 0.5 : 0.65) + dist * dist * (inner ? 0.95 : 1.65) + rand() * 0.5;
      // each lump is also shaded on its own: lighter on top, darker underneath, so lumps and tiers stay distinct
      const own = p.flat ? 1 : 1 + Math.max(-1, Math.min(1, dy / p.ry)) * -0.16 - Math.max(0, dy / p.ry - 0.55) * 0.25;
      const f = tone(x, y) * own * (0.88 + rand() * 0.22) * (inner ? 0.95 : 1);
      ctx.strokeStyle = rgba(f, 0.4 + rand() * 0.45, rgb);
      ctx.lineWidth = 0.2 + rand() * 0.24;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(x, y);
      const bend = (rand() - 0.5) * 0.8;
      ctx.quadraticCurveTo(x + Math.cos(ang + bend) * len * 0.6, y + Math.sin(ang + bend) * len * 0.6, x + Math.cos(ang) * len, y + Math.sin(ang) * len);
      ctx.stroke();
    }
    // A sprinkle of light tips catches the light on the side facing it.
    for (let i = 0; i < count * 0.12; i += 1) {
      const x = p.box.x0 + rand() * (p.box.x1 - p.box.x0), y = p.box.y0 + rand() * (p.box.y1 - p.box.y0);
      if (!inside(p, x, y) || tone(x, y) < 1) continue;
      ctx.fillStyle = `rgba(255,255,255,${0.08 + rand() * 0.14})`;
      ctx.fillRect(x, y, 0.35, 0.35);
    }
  });
  const url = canvas.toDataURL('image/png');
  FUR_CACHE.set(key, url);
  return url;
}

// Motion for live portraits: the face slides across the body as if the head turns left and right, the eyes blink.
const TURN = 'dur="7s" repeatCount="indefinite" calcMode="spline" keyTimes="0;.3;.5;.8;1" keySplines=".45 0 .55 1;.45 0 .55 1;.45 0 .55 1;.45 0 .55 1"';
const turnBy = (dx) => `<animateTransform attributeName="transform" type="translate" values="0 0;0 0;${dx} 0;${dx} 0;0 0" ${TURN}/>`;
// Now and then a small hop (with a little second bounce); the shadow shrinks while it is in the air.
const JUMP_TIMING = 'keyTimes="0;.8;.86;.92;.95;.98;1" dur="6.5s" repeatCount="indefinite" calcMode="spline" keySplines="0 0 1 1;.2 .6 .4 1;.6 0 .8 .4;.2 .6 .4 1;.6 0 .8 .4;0 0 1 1"';
const JUMP = `<animateTransform attributeName="transform" type="translate" values="0 0;0 0;0 -8;0 0;0 -2.5;0 0;0 0" ${JUMP_TIMING}/>`;
const JUMP_SHADOW = `<animateTransform attributeName="transform" type="scale" values="1 1;1 1;.78 .78;1 1;.93 .93;1 1;1 1" ${JUMP_TIMING}/>`;
const blinkAt = (y, inner) => `<g transform="translate(0 ${y})"><g><animateTransform attributeName="transform" type="scale" values="1 1;1 1;1 .08;1 1" keyTimes="0;.9;.94;1" dur="4.3s" repeatCount="indefinite"/><g transform="translate(0 ${-y})">${inner}</g></g></g>`;

function builtAvatarSvg(a, animate = false) {
  const shape = pick(AV_SHAPES, a.shape), color = pick(AV_COLORS, a.color);
  const face = pick(AV_FACES, a.face), extra = pick(AV_EXTRAS, a.acc);
  const ink = color.dark ? '#f6f2ea' : '#221b25';
  const fy = shape.fy;
  const M = (inner) => `<g transform="matrix(-1 0 0 1 120 0)">${inner}</g>`;
  const blush = !face.blush ? '' : M([[shape.fx - 16, 5], [shape.fx + 16, 5]].map(([x, rx]) => `<ellipse cx="${x}" cy="${fy + 6}" rx="${rx}" ry="3.4" fill="#ff7f86" opacity="${color.dark ? '.55' : '.42'}" filter="url(#blushF)"/>`).join(''));
  const eyes = `<g filter="url(#lift)">${M(face.draw({ x: shape.fx, y: fy }, ink, !color.dark))}</g>`;
  const faceLayer = blush + (animate && !face.noBlink ? blinkAt(fy, eyes) : eyes);
  const extraLayer = `<g filter="url(#lift)">${M(extra.draw(shape, ink))}</g>`;
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="240" height="240">`
    + `<defs>`
    + `<filter id="ground" x="-50%" y="-200%" width="200%" height="500%"><feGaussianBlur stdDeviation="2.6"/></filter>`
    + `<filter id="contact" x="-50%" y="-200%" width="200%" height="500%"><feGaussianBlur stdDeviation="1.2"/></filter>`
    + `<filter id="blushF" x="-50%" y="-80%" width="200%" height="260%"><feGaussianBlur stdDeviation="1.6"/></filter>`
    + `<filter id="lift" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx=".4" dy="1.4" stdDeviation=".9" flood-color="#2a1e30" flood-opacity=".28"/></filter>`
    + `</defs>`
    + `<rect width="120" height="120" rx="14" fill="#eef6f3"/>`
    + (animate ? `<g transform="translate(60 101)"><g>${JUMP_SHADOW}<g transform="translate(-60 -101)">` : '')
    + `<ellipse cx="63" cy="101" rx="35" ry="5.5" fill="#1d2a26" opacity=".34" filter="url(#ground)"/>`
    + `<ellipse cx="58" cy="99.5" rx="23" ry="2.6" fill="#1d2a26" opacity=".38" filter="url(#contact)"/>`
    + (animate ? `</g></g></g><g>${JUMP}` : '')
    + (animate ? `<g>${turnBy(1.5)}` : '<g>') + `<image width="120" height="120" href="${furPng(shape, color)}"/></g>`
    + (animate ? `<g>${turnBy(13)}${faceLayer}</g>` : faceLayer)
    + (animate ? `<g>${turnBy(7)}${extraLayer}</g>` : extraLayer)
    + (animate ? '</g>' : '')
    + `</svg>`;
}

// data.avatar is a dress-up recipe { shape, color, face, acc }; a number is one of the older ready-made illustrations (used by the sample entry).
// animate: true gives the moving portrait (turning and blinking) used while answering and on the finished article.
// spot names where the image sits: each animated copy gets its own address, because Safari freezes an animated
// image that is shown in more than one place at once.
const avatarUrl = (a, animate = false, spot = '') => 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(
  (Number.isInteger(a) ? illustrationSvg(a) : builtAvatarSvg({ ...AV_DEFAULT, ...(a || {}) }, animate)) + (spot ? `<!--${spot}-->` : ''));


/* ---------- translating free-text answers ---------- */
// Answers typed by hand appear in both the English and the Japanese text. Each is translated once
// (English → Japanese or Japanese → English); until then, or if translation fails, they show as typed.
const TR_CACHE = new Map(); // typed text → { en, ja }
const isOption = (list, value) => list.some(([en]) => en === value);
const trEn = (t) => { const k = (t || '').trim(); return TR_CACHE.get(k)?.en || k; };
const trJa = (t) => { const k = (t || '').trim(); const preset = jaOf(k); return preset !== k ? preset : (TR_CACHE.get(k)?.ja || k); };

function freeTextItems(data) {
  const items = [];
  const add = (text, role) => { const t = (text || '').trim().replace(/[.。]$/, ''); if (t && !items.some((i) => i.text === t)) items.push({ text: t, role }); };
  if (data.name && !isOption(nameOptions, data.name)) add(data.name, 'a person’s name. Japanese names go into English romanized in Western order (Given Family); other names go into Japanese in katakana.');
  add(data.titleOther, 'the person\'s occupation or title. English fits "X was ___" (with a/an); Japanese is a noun phrase that fits "〜出身の___。"');
  add(data.traitOther, 'what the person was like. English fits "known for being ___". Japanese must be able to go right before 人物 (for example ちょっと頑固な); change the typed Japanese only as much as that needs.');
  const place = (data.birthplace || '').trim();
  if (place && !allOptions.find(([e]) => e === place)) { const p = placeNames(place); if (p.en === p.ja) add(place, 'a birthplace: a place name, or a phrase saying where. English fits "born ___" (a name or a noun phrase is written without "in"; a phrase like "in a stable" keeps its preposition); Japanese is a place name or a phrase ending in で like 馬小屋で.'); }
  add(data.mattered, 'something the person cherished. English is a short phrase that fits "X cherished ___" (third person, no quotes); Japanese is a noun phrase that fits "___を大切にしていた。"');
  add(data.anecdote, 'a short anecdote about the person. Write a full sentence in each language.');
  if (!isOption(endWhoOptions, data.endWho)) add(data.endWho, 'who was with them when they died. English like "surrounded by family"; Japanese like "家族に囲まれて".');
  if (!isOption(endConditionOptions, data.endCondition)) add(data.endCondition, 'the state they were in when they died. English like "just like their usual self"; Japanese like "いつもの調子で".');
  if (!isOption(endPlaceOptions, data.endPlace)) add(data.endPlace, 'where they died. English like "in a hospital bed"; Japanese like "病院のベッドで".');
  add(data.viewTopicOther, 'a topic about life and death that the person took a position on. English is a noun phrase that fits "On ___, X was in favor"; Japanese is a noun phrase that fits "___については".');
  add(data.viewReason, 'the person\'s reason for their position. English is a noun phrase that fits "citing ___"; Japanese is a phrase that fits "___という理由から" (no から or ので at the end).');
  add(data.lastWords, 'the person\'s last words, a quotation. Keep it as words they said (first person is fine here); no quotation marks.');
  add(data.legacyTo, 'who the person left something to. English is a noun phrase in third person (my sister → their sister) that fits "left X to ___"; Japanese is a noun that fits "___に".');
  add(data.legacyWhat, 'what the person left to someone. English is a noun phrase in third person (my guitar → their guitar) that fits "left ___ to someone"; Japanese is a noun that fits "___を遺した".');
  add(data.endOther, 'how their life ended, a phrase. English fits "Of their last moments, it is said: ___"; Japanese fits "その最期は「___」であったという。"');
  return items;
}

// Free-text answers are translated with MyMemory (https://mymemory.translated.net), a free translation service
// that can be called straight from the browser, so this page works on any ordinary web host.
// Anonymous use allows 5,000 characters a day per IP address. Put an email address here to raise that to
// 50,000 characters a day for the whole site (counted for the address, not per visitor).
const MYMEMORY_EMAIL = 'caminacartes@gmail.com';
const decodeEntities = (t) => { const el = document.createElement('textarea'); el.innerHTML = t; return el.value; };
const toThirdPerson = (t) => t.replace(/\bmyself\b/gi, 'themselves').replace(/\bmy\b/gi, 'their').replace(/\bmine\b/gi, 'theirs').replace(/\bme\b/gi, 'them').replace(/\bI\b/g, 'they');

async function myMemory(text, from, to) {
  const url = `https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=${from}|${to}${MYMEMORY_EMAIL ? `&de=${encodeURIComponent(MYMEMORY_EMAIL)}` : ''}`;
  const res = await fetch(url);
  if (!res.ok) throw new Error(`http_${res.status}`);
  const body = await res.json();
  const out = decodeEntities(String(body?.responseData?.translatedText || '')).trim();
  // over the daily limit, MyMemory answers with a warning in place of a translation
  if (Number(body?.responseStatus) !== 200 || !out || /MYMEMORY WARNING|QUERY LENGTH LIMIT|INVALID LANGUAGE/i.test(out)) throw new Error('limit');
  return out;
}

// One request may carry up to 500 bytes, so longer text goes sentence by sentence.
async function translateText(text, from, to) {
  if (new TextEncoder().encode(text).length <= 450) return myMemory(text, from, to);
  const parts = text.match(/[^。．.!?！？]+[。．.!?！？]*/g) || [text];
  const done = [];
  for (const part of parts) done.push(await myMemory(part.trim(), from, to));
  return done.join(to === 'ja' ? '' : ' ');
}

// Resolves 'done', 'partial' (some came back), or 'upstream_error' (nothing could be translated).
async function translateFreeText(items) {
  const todo = items.filter((i) => !TR_CACHE.has(i.text));
  if (!todo.length) return 'done';
  await Promise.all(todo.map(async ({ text, role }) => {
    const ja = hasJapanese(text);
    const isQuote = role.startsWith('the person\'s last words');
    const isName = role.startsWith('a person’s name');
    // a name in kana is romanized here (あゆみ → Ayumi) rather than sent to be translated as a word
    if (isName && isKanaOnly(text)) { TR_CACHE.set(text, { en: kanaToRomaji(text), ja: text }); return; }
    try {
      let other = (await translateText(text, ja ? 'ja' : 'en', ja ? 'en' : 'ja')).replace(/[.。]$/, '');
      if (ja) {
        if (isName && !/[A-Za-z]/.test(other)) other = text; // a name the service could not read stays as typed
        if (!isQuote && !isName && !role.startsWith('a short anecdote')) other = toThirdPerson(other.charAt(0).toLowerCase() + other.slice(1));
        TR_CACHE.set(text, { en: other, ja: text });
      } else {
        TR_CACHE.set(text, { en: isQuote || isName ? text : toThirdPerson(text), ja: other });
      }
    } catch { /* this one stays as typed */ }
  }));
  const got = todo.filter((i) => TR_CACHE.has(i.text)).length;
  return got === todo.length ? 'done' : got ? 'partial' : 'upstream_error';
}

function toggleValue(values, value) {
  return values.includes(value) ? values.filter((item) => item !== value) : [...values, value];
}

function listEn(items) {
  if (items.length <= 1) return items.join('');
  return items.slice(0, -1).join(', ') + ' and ' + items[items.length - 1];
}

/* Everything the article and the saved card print, derived once from the answers. */
function entryOf(data) {
  // Typed answers go through trEn / trJa, so each language shows its own version once it is translated.
  const titlesEn = [...data.titles, trEn(data.titleOther)].filter(Boolean);
  const titlesJa = [...data.titles.map(jaOf), trJa(data.titleOther)].filter(Boolean);
  const traitsEn = [...data.traits, trEn(data.traitOther)].filter(Boolean);
  const traitsJaText = traitsJaPhrase(data.traits, trJa(data.traitOther));
  const endRaw = [data.endCondition, data.endWho, data.endPlace].map((v) => v.trim()).filter(Boolean);
  const endParts = endRaw.map(trEn);
  const endPartsJa = endRaw.map(trJa);
  const over100 = data.lifespan >= 100;
  const born = data.birthYear || '20XX';
  const deathYear = data.birthYear ? Number(data.birthYear) + data.lifespan : '20XX';
  // a name typed in kana is romanized straight away (あゆみ → Ayumi); others wait for the translation
  const name = data.name ? (TR_CACHE.get(data.name.trim())?.en || (isKanaOnly(data.name.trim()) ? kanaToRomaji(data.name.trim()) : data.name.trim())) : 'Name not given yet';
  const nameJa = data.name ? trJa(data.name) : 'まだ名前のない人';
  const title = listEn(titlesEn) || 'someone who found their own way';
  const titleJa = titlesJa.join('、') || '自分の道を歩いた人';
  const traits = listEn(traitsEn);
  // A preset ("a small town") or the sample's place keeps its own translation; anything typed goes through placeNames.
  const presetPlace = allOptions.find(([e]) => e === data.birthplace);
  const place = presetPlace ? { en: presetPlace[0], ja: presetPlace[1] } : placeNames(data.birthplace || '');
  const placeTr = TR_CACHE.get((data.birthplace || '').trim());
  const birthplace = placeTr?.en || place.en || 'somewhere';
  const birthplaceJa = placeTr?.ja || place.ja || 'どこかの街';
  const matteredRaw = data.mattered.trim().replace(/[.。]$/, '');
  // chosen chips plus anything typed, e.g. "their honest feelings and making coffee" / 「自分の正直な気持ちや毎朝コーヒーを淹れること」
  const mattersEn = [...(data.matters || []).map(articleEnOf), trEn(matteredRaw)].filter(Boolean);
  const mattersJa = [...(data.matters || []).map(jaOf), trJa(matteredRaw)].filter(Boolean);
  const mattered = listEn(mattersEn);
  const matteredJa = mattersJa.length > 1 ? mattersJa.slice(0, -1).join('、') + 'や' + mattersJa[mattersJa.length - 1] : mattersJa.join('');
  const anecdoteRaw = data.anecdote.trim().replace(/[.。]$/, '');
  const anecdote = trEn(anecdoteRaw), anecdoteJa = trJa(anecdoteRaw);
  // one belief: "臓器移植については、遺族感情への配慮という理由から、反対の立場を取っていた。"
  const topicRaw = (data.viewTopic || (data.viewTopicOther || '').trim()).replace(/[.。]$/, '');
  const reasonRaw = (data.viewReason || '').trim().replace(/[.。]$/, '');
  const view = topicRaw && data.viewStance ? {
    stance: data.viewStance,
    topicEn: data.viewTopic ? articleEnOf(data.viewTopic) : trEn(topicRaw),
    topicJa: trJa(topicRaw),
    reasonEn: reasonRaw ? trEn(reasonRaw) : '',
    reasonJa: reasonRaw ? trJa(reasonRaw).replace(/(から|ので|ため)$/, '') : '',
  } : null;
  // last words (a quote, kept as said) and something left to someone: 「妹にギターを遺した。」
  const lastWordsRaw = (data.lastWords || '').trim().replace(/[.。]$/, '');
  const lastWords = lastWordsRaw ? trEn(lastWordsRaw) : '', lastWordsJa = lastWordsRaw ? trJa(lastWordsRaw) : '';
  const toRaw = (data.legacyTo || '').trim(), whatRaw = (data.legacyWhat || '').trim();
  const legacy = toRaw || whatRaw ? {
    toEn: toRaw ? trEn(toRaw) : '', toJa: toRaw ? trJa(toRaw).replace(/に$/, '') : '',
    whatEn: whatRaw ? trEn(whatRaw) : '', whatJa: whatRaw ? trJa(whatRaw).replace(/を$/, '') : '',
  } : null;
  const endOtherRaw = data.endOther.trim().replace(/[.。]$/, '');
  const endOther = trEn(endOtherRaw), endOtherJa = trJa(endOtherRaw);
  const sentence = (s) => (/[.!?。！？”」]$/.test(s) ? s : s + '.');

  // Lead paragraph in encyclopedia style: life span, identity, character, values, death, anecdote.
  const lead = [
    `${name} (${over100 ? `born ${born}` : `${born} – ${deathYear}`}) was ${title}, born ${/^(at|in|on|by|under|inside|near|aboard)\s/i.test(birthplace) ? '' : 'in '}${birthplace}.`,
    traits && `Throughout life, ${name} was known for being ${traits}.`,
    mattered && `${name} cherished ${mattered}.`,
    view && `On ${view.topicEn}, ${name} was ${view.stance === 'for' ? 'in favor' : 'against it'}${view.reasonEn ? `, citing ${view.reasonEn}` : ''}.`,
    over100
      ? `${name} lived past the age of 100${endParts.length ? ` and died ${endParts.join(', ')}` : ''}.`
      : `${name} died in ${deathYear} at the age of ${data.lifespan}${endParts.length ? `, ${endParts.join(', ')}` : ''}.`,
    endOther && `Of their last moments, it is said: “${endOther}.”`,
    lastWords && `${name}'s last words are said to have been “${lastWords}.”`,
    legacy && (legacy.whatEn && legacy.toEn ? `${name} left ${legacy.whatEn} to ${legacy.toEn}.` : legacy.whatEn ? `${name} left behind ${legacy.whatEn}.` : `${name} left something precious to ${legacy.toEn}.`),
    anecdote && `One story about ${name} is still told: ${sentence(anecdote)}`,
  ].filter(Boolean).join(' ');

  const leadJa = [
    `${nameJa}（${over100 ? `${born}年 -` : `${born}年 - ${deathYear}年`}）は、${birthplaceJa}${/で$/.test(birthplaceJa) ? '生まれた' : '出身の'}${titleJa}。`,
    traitsJaText && `生涯を通じて、${traitsJaText}人物として知られた。`,
    matteredJa && `${matteredJa}を大切にしていた。`,
    view && `${view.topicJa}については、${view.reasonJa ? `${view.reasonJa}という理由から、` : ''}${view.stance === 'for' ? '賛成' : '反対'}の立場を取っていた。`,
    over100
      ? `100歳を超えて生き、${endPartsJa.join('、')}この世を去った。`
      : `${deathYear}年、${endPartsJa.join('、')}この世を去った。享年${data.lifespan}歳。`,
    endOtherJa && `その最期は「${endOtherJa}」であったという。`,
    lastWordsJa && `最期の言葉は「${lastWordsJa}」だったと伝えられている。`,
    legacy && (legacy.whatJa && legacy.toJa ? `${legacy.toJa}に${legacy.whatJa}を遺した。` : legacy.whatJa ? `${legacy.whatJa}を遺した。` : `${legacy.toJa}に大切なものを遺した。`),
    anecdoteJa && `「${anecdoteJa}」という逸話が残っている。`,
  ].filter(Boolean).join('');

  return {
    name, nameJa, title, titleJa, birthplace, birthplaceJa, lead, leadJa,
    traits: traits || '—',
    born,
    died: over100 ? `after ${data.birthYear ? Number(data.birthYear) + 100 : '20XX'}` : String(deathYear),
    age: over100 ? '100 or older' : String(data.lifespan),
    share: `${lead}\n\n${leadJa}`,
  };
}

// The line an encyclopedia prints at the foot of an entry.
const lastEdited = () => [
  `This entry was last edited on ${new Date().toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' })}.`,
  `この記事の最終更新：${new Date().toLocaleDateString('ja-JP', { year: 'numeric', month: 'long', day: 'numeric' })}`,
];

const NOTE = ['This game is fiction.', 'このゲームはフィクションです。'];

/* ---------- saved card: 1080×1920 PNG drawn on canvas ---------- */

// Japanese line-breaking rules (kinsoku): these never start a line, and these never end one.
const NO_LINE_START = '、。，．・：；？！ー～…‥」』）〕］｝〉》】ぁぃぅぇぉっゃゅょゎァィゥェォッャュョヮヵヶ々゛゜,.:;?!)]}”’%';
const NO_LINE_END = '「『（〔［｛〈《【“‘([{';

// Splits text into pieces that must stay together: an English word or number with its trailing space, or a
// single Japanese character; closing marks join the piece before them and opening marks the piece after.
function breakUnits(text) {
  const raw = text.match(/[A-Za-z0-9À-ÿ'’\-–.,:;!?%&/]+\s*|\s+|./gu) || [];
  const units = [];
  let pendingOpen = '';
  for (const piece of raw) {
    if (piece.length === 1 && NO_LINE_END.includes(piece)) { pendingOpen += piece; continue; }
    if (units.length && !pendingOpen && piece.length === 1 && NO_LINE_START.includes(piece)) { units[units.length - 1] += piece; continue; }
    units.push(pendingOpen + piece);
    pendingOpen = '';
  }
  if (pendingOpen) units.push(pendingOpen);
  return units;
}

// widthOf(i) gives the allowed width of line i, so a drop cap can indent the first lines.
// A closing mark that would start a new line is hung at the end of the line instead (burasage).
function wrapLines(ctx, text, widthOf) {
  const maxFor = typeof widthOf === 'function' ? widthOf : () => widthOf;
  const lines = [];
  let line = '';
  const push = (t) => {
    if (!line || ctx.measureText((line + t).trimEnd()).width <= maxFor(lines.length)) { line += t; return; }
    lines.push(line.trimEnd());
    line = t.trimStart();
  };
  for (const unit of breakUnits(text)) {
    if (ctx.measureText(unit.trimEnd()).width <= maxFor(lines.length)) { push(unit); continue; }
    for (const ch of unit) push(ch); // a single piece wider than the line breaks by character
  }
  if (line.trim()) lines.push(line.trimEnd());
  // A line that would begin with a closing mark gives it back to the line before.
  for (let i = 1; i < lines.length; i += 1) {
    while (lines[i] && NO_LINE_START.includes(lines[i][0])) { lines[i - 1] += lines[i][0]; lines[i] = lines[i].slice(1); }
  }
  return lines.filter((l) => l.length);
}

// Where the portrait sits on the 1080×1920 card; the live card lays its moving portrait over exactly this spot.
const CARD_PORTRAIT = { x: 690, y: 290, size: 220, radius: 8 };

// The card looks like a page of study notes: a loose-leaf grid page on a desk, washi tape, index flags,
// a taped-in photo, a highlighted name and boxed notes. Every colour comes from the avatar's fur colour.
// The portrait's place on the card can move with the length of the name; each finished card records where it went.
let lastCardLayout = null;
const CARD_LAYOUTS = new Map(); // card image URL → portrait rect

async function renderCardPng(data) {
  const e = entryOf(data);
  const W = 1080, H = 1920, CX = W / 2;
  const colorEntry = Number.isInteger(data.avatar) ? AV_COLORS[3] : pick(AV_COLORS, (data.avatar || {}).color);
  const base = colorEntry.fill;
  const tint = (t) => mixHex(base, '#ffffff', t);
  const C = {
    desk: mixHex(base, '#f6f4f0', 0.86), deskLow: mixHex(base, '#efece6', 0.8),
    page: '#fffefb', grid: mixHex(base, '#ffffff', 0.78), ink: '#2f2e3c', body: '#45445a', sub: '#6a6979', faint: '#94939f',
    pale: tint(0.86), light: tint(0.68), mid: tint(0.42), deep: mixHex(base, '#2f2e3c', 0.42),
  };
  const round = '"Zen Maru Gothic", "Hiragino Maru Gothic ProN", "Zen Kaku Gothic New", "Noto Sans CJK JP", sans-serif';
  const gothic = '"Zen Kaku Gothic New", "Hiragino Sans", "Noto Sans JP", "Noto Sans CJK JP", sans-serif';
  const hand = '"Caveat", "Zen Maru Gothic", cursive';
  const formal = '"Shippori Mincho", "Hiragino Mincho ProN", "Noto Serif CJK JP", serif'; // the yourwiki name: a proper, bookish serif
  const bubble = '"Cherry Bomb One", "Zen Maru Gothic", sans-serif'; // the person\'s name: fat, rounded letters that overlap
  const botan = '"Amatic SC", "Zen Maru Gothic", cursive'; // small labels: thin, hand-drawn capitals
  const mono = '"DM Mono", ui-monospace, Menlo, monospace';
  const allText = Object.values(e).join('') + 'yourwiki DATE English 日本語 FICTIONAL ENTRY 架空の記事 享年歳 Everything here is a setting chosen in a game. ここに書かれていることは、すべてゲームで選んだ設定です。' + colorEntry.label.join('');
  try {
    await Promise.all([
      document.fonts.load(`700 88px "Zen Maru Gothic"`, allText),
      document.fonts.load(`500 30px "Zen Maru Gothic"`, allText),
      document.fonts.load(`400 28px "Zen Kaku Gothic New"`, allText),
      document.fonts.load(`600 40px "Caveat"`, allText),
      document.fonts.load(`700 90px "Caveat"`, allText),
      document.fonts.load(`400 90px "Cherry Bomb One"`, allText),
      document.fonts.load(`700 40px "Amatic SC"`, allText),
      document.fonts.load(`700 40px "Shippori Mincho"`, 'yourwiki'),
      document.fonts.load(`400 30px "DM Mono"`, '0123456789–.DATE'),
      document.fonts.load(`700 60px "Dancing Script"`, 'W'),
    ]);
  } catch { /* falls back to system faces */ }

  const canvas = document.createElement('canvas');
  canvas.width = W; canvas.height = H;
  const ctx = canvas.getContext('2d');
  ctx.textBaseline = 'alphabetic';
  const rand = seededRandom(`${e.name}|${base}`);
  const spaced = (px) => { if ('letterSpacing' in ctx) ctx.letterSpacing = px; };
  const text = (t, x, y, align = 'left') => { ctx.textAlign = align; ctx.fillText(t, x, y); ctx.textAlign = 'left'; };
  const rr = (x, y, w, h, r) => { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); };
  const shadow = (blur, dy, a) => { ctx.shadowColor = `rgba(47,46,60,${a})`; ctx.shadowBlur = blur; ctx.shadowOffsetY = dy; };
  const fitFont = (t, weight, size, family, maxW, min) => { let s = size; for (;;) { ctx.font = `${weight} ${s}px ${family}`; if (ctx.measureText(t).width <= maxW || s <= min) return s; s -= 2; } };
  // A strip of washi tape: translucent, with torn (zigzag) ends and a pattern of dots or stripes.
  const tape = (cx, cy, w, h, angle, color, pattern) => {
    ctx.save(); ctx.translate(cx, cy); ctx.rotate(angle * Math.PI / 180);
    ctx.beginPath();
    const teeth = 7;
    ctx.moveTo(-w / 2, -h / 2);
    ctx.lineTo(w / 2, -h / 2);
    for (let i = 1; i <= teeth; i += 1) ctx.lineTo(w / 2 + (i % 2 ? 5 : 0), -h / 2 + (h * i) / teeth);
    ctx.lineTo(-w / 2, h / 2);
    for (let i = teeth - 1; i >= 0; i -= 1) ctx.lineTo(-w / 2 + (i % 2 ? -5 : 0), -h / 2 + (h * i) / teeth);
    ctx.closePath();
    ctx.globalAlpha = 0.82; ctx.fillStyle = color; ctx.fill();
    ctx.clip();
    ctx.globalAlpha = 0.5; ctx.fillStyle = '#ffffff';
    if (pattern === 'dots') for (let x = -w / 2 + 12; x < w / 2; x += 22) for (let y = -h / 2 + 12; y < h / 2; y += 20) { ctx.beginPath(); ctx.arc(x + ((y / 20) % 2 ? 11 : 0), y, 3.2, 0, Math.PI * 2); ctx.fill(); }
    else for (let x = -w / 2 - h; x < w / 2; x += 26) { ctx.beginPath(); ctx.moveTo(x, h / 2); ctx.lineTo(x + h, -h / 2); ctx.lineTo(x + h + 10, -h / 2); ctx.lineTo(x + 10, h / 2); ctx.fill(); }
    ctx.restore();
  };
  // a four-pointed sparkle with curved sides (✦), plus a tiny one beside it
  const sparkle = (x, y, r, color) => {
    const one = (cx, cy, rr) => { ctx.beginPath(); ctx.moveTo(cx, cy - rr); ctx.quadraticCurveTo(cx, cy, cx + rr, cy); ctx.quadraticCurveTo(cx, cy, cx, cy + rr); ctx.quadraticCurveTo(cx, cy, cx - rr, cy); ctx.quadraticCurveTo(cx, cy, cx, cy - rr); ctx.fill(); };
    ctx.fillStyle = color; one(x, y, r); one(x + r * 0.95, y - r * 0.85, r * 0.42);
  };
  const star = (x, y, r, color) => { ctx.fillStyle = color; ctx.beginPath(); for (let i = 0; i < 10; i += 1) { const a = -Math.PI / 2 + (i * Math.PI) / 5, rad = i % 2 ? r * 0.45 : r; ctx.lineTo(x + Math.cos(a) * rad, y + Math.sin(a) * rad); } ctx.closePath(); ctx.fill(); };

  // desk
  const g = ctx.createLinearGradient(0, 0, W, H);
  g.addColorStop(0, C.desk); g.addColorStop(1, C.deskLow);
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

  // index flags peeking out from behind the page's right edge
  const PX0 = 70, PY0 = 120, PW = 920, PH = 1740;
  [[300, C.light], [400, C.mid], [500, C.pale]].forEach(([fy, col]) => {
    ctx.save(); shadow(10, 3, 0.12); ctx.fillStyle = col; rr(PX0 + PW - 40, fy, 104, 82, 14); ctx.fill(); ctx.restore();
  });

  // the loose-leaf page: grid, binder holes, soft shadow
  ctx.save(); shadow(40, 16, 0.16); ctx.fillStyle = C.page; rr(PX0, PY0, PW, PH, 22); ctx.fill(); ctx.restore();
  ctx.save(); rr(PX0, PY0, PW, PH, 22); ctx.clip();
  ctx.strokeStyle = C.grid; ctx.lineWidth = 1.4;
  for (let x = PX0 + 90; x < PX0 + PW; x += 34) { ctx.beginPath(); ctx.moveTo(x, PY0); ctx.lineTo(x, PY0 + PH); ctx.stroke(); }
  for (let y = PY0 + 20; y < PY0 + PH; y += 34) { ctx.beginPath(); ctx.moveTo(PX0 + 90, y); ctx.lineTo(PX0 + PW, y); ctx.stroke(); }
  ctx.fillStyle = C.page; ctx.fillRect(PX0, PY0, 70, PH);
  ctx.strokeStyle = C.mid; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(PX0 + 90, PY0); ctx.lineTo(PX0 + 90, PY0 + PH); ctx.stroke();
  for (let y = PY0 + 70; y < PY0 + PH - 40; y += 74) {
    ctx.fillStyle = C.desk; ctx.beginPath(); ctx.arc(PX0 + 40, y, 12, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = 'rgba(47,46,60,.12)'; ctx.lineWidth = 1.5; ctx.stroke();
  }
  ctx.restore();

  // washi tape holding the page down
  tape(PX0 + 70, PY0 + 6, 230, 58, -32, C.light, 'dots');
  tape(PX0 + PW - 70, PY0 + PH - 10, 230, 58, -32, C.mid, 'stripes');

  const X = PX0 + 130, CW = PW - 190, RIGHT = X + CW;

  // page header: the yourwiki mark on the left, the colour label on the right
  ctx.fillStyle = C.deep; ctx.font = `700 54px "Dancing Script", cursive`; text('W', X, PY0 + 112);
  ctx.fillStyle = C.ink; ctx.font = `700 40px ${formal}`; text('yourwiki', X + 68, PY0 + 106);
  const pill = `${AV_COLORS.indexOf(colorEntry) + 1}. ${colorEntry.label[0].toLowerCase()}`;
  ctx.font = `700 40px ${botan}`;
  const pw = ctx.measureText(pill).width + 44;
  ctx.fillStyle = C.light; rr(RIGHT - pw, PY0 + 66, pw, 52, 26); ctx.fill();
  ctx.fillStyle = C.deep; text(pill, RIGHT - pw / 2, PY0 + 106, 'center');
  sparkle(RIGHT - pw - 26, PY0 + 94, 15, C.mid);
  ctx.fillStyle = C.mid; ctx.fillRect(X, PY0 + 140, CW, 2);
  // the name in fat bubble letters that overlap a little, each with a white outline (measured first, drawn below)
  const P = CARD_PORTRAIT.size, PX = CARD_PORTRAIT.x;
  const LW = PX - 40 - X;
  const OVERLAP = 0.13; // how far each letter tucks under the next, as a share of the font size
  const chars = (t) => [...t];
  const bubbleWidth = (t, size) => {
    ctx.font = `400 ${size}px ${bubble}`;
    const cs = chars(t);
    return cs.reduce((w, ch, i) => w + ctx.measureText(ch).width - (i && ch !== ' ' && cs[i - 1] !== ' ' ? size * OVERLAP : 0), 0);
  };
  const bubbleLines = (t, size) => {
    const words = t.split(/\s+/).filter(Boolean);
    const lines = [];
    words.forEach((w) => { const cur = lines[lines.length - 1]; if (cur && bubbleWidth(`${cur} ${w}`, size) <= LW) lines[lines.length - 1] = `${cur} ${w}`; else lines.push(w); });
    return lines;
  };
  let nameSize = 96;
  while (nameSize > 72 && bubbleWidth(e.name, nameSize) > LW) nameSize -= 2;
  let nameLines = [e.name];
  if (bubbleWidth(e.name, nameSize) > LW) {
    for (nameSize = 80; nameSize > 44; nameSize -= 2) { nameLines = bubbleLines(e.name, nameSize); if (nameLines.length <= 2 && nameLines.every((l) => bubbleWidth(l, nameSize) <= LW)) break; }
  }
  nameLines = nameLines.slice(0, 2);
  const hasJa = Boolean(e.nameJa && e.nameJa !== e.name);

  // The text block (name, Japanese name, dates) and the photo sit side by side with their bottoms level,
  // so the English box starts right under whichever is taller.
  const textHeight = nameSize * 0.82 + (nameLines.length - 1) * nameSize * 1.02 + (hasJa ? 50 : 0) + 66 + 14;
  const photoHeight = P + 74;
  const blockTop = PY0 + 164;
  const blockBottom = blockTop + Math.max(textHeight, photoHeight);
  const PY = blockBottom - photoHeight + 16;
  lastCardLayout = { x: PX, y: PY, size: P, radius: CARD_PORTRAIT.radius };

  // the photo: a small white-bordered print taped to the top right; the text is the main thing on this page
  ctx.save(); shadow(22, 8, 0.18); ctx.fillStyle = '#ffffff'; rr(PX - 16, PY - 16, P + 32, P + 74, 8); ctx.fill(); ctx.restore();
  const portrait = new Image();
  portrait.src = avatarUrl(data.avatar);
  await portrait.decode();
  ctx.save(); rr(PX, PY, P, P, CARD_PORTRAIT.radius); ctx.clip(); ctx.drawImage(portrait, PX, PY, P, P); ctx.restore();
  ctx.fillStyle = C.sub; ctx.font = `700 40px ${botan}`; text('fictional entry', PX + P / 2, PY + P + 46, 'center');
  tape(PX + P / 2, PY - 16, 150, 42, -5, C.pale, 'stripes');
  sparkle(PX - 36, PY + P + 26, 20, C.mid); sparkle(PX + P + 6, PY + P + 62, 15, C.light);

  const nameFill = mixHex(base, '#2f2e3c', colorEntry.dark ? 0.05 : 0.3);
  let y = blockBottom - textHeight + nameSize * 0.82;
  nameLines.forEach((line) => {
    ctx.font = `400 ${nameSize}px ${bubble}`;
    ctx.lineJoin = 'round';
    let x = X;
    chars(line).forEach((ch, i, cs) => {
      if (i && ch !== ' ' && cs[i - 1] !== ' ') x -= nameSize * OVERLAP;
      ctx.fillStyle = 'rgba(47,46,60,.16)'; ctx.fillText(ch, x + 3, y + 5);
      ctx.strokeStyle = C.page; ctx.lineWidth = nameSize * 0.07; ctx.strokeText(ch, x, y);
      ctx.fillStyle = nameFill; ctx.fillText(ch, x, y);
      x += ctx.measureText(ch).width;
    });
    y += nameSize * 1.02;
  });
  y -= nameSize * 1.02;
  if (hasJa) { y += 50; ctx.fillStyle = C.sub; ctx.font = `500 34px ${round}`; text(e.nameJa, X, y); }
  y += 66;
  const dates = `${e.born} – ${e.died}`;
  const ageTag = e.age === '100 or older' ? '100歳以上' : `享年${e.age}歳`;
  ctx.font = `500 28px ${mono}`; const dw = ctx.measureText(dates).width + 40;
  ctx.font = `700 25px ${round}`; const aw = ctx.measureText(ageTag).width + 40;
  ctx.fillStyle = '#ffffff'; ctx.strokeStyle = C.mid; ctx.lineWidth = 2; rr(X, y - 36, dw, 50, 25); ctx.fill(); ctx.stroke();
  ctx.fillStyle = C.deep; ctx.font = `500 28px ${mono}`; text(dates, X + dw / 2, y - 1, 'center');
  ctx.fillStyle = C.light; rr(X + dw + 12, y - 36, aw, 50, 25); ctx.fill();
  ctx.fillStyle = C.deep; ctx.font = `700 25px ${round}`; text(ageTag, X + dw + 12 + aw / 2, y - 2, 'center');
  y = blockBottom;

  // two note boxes, English and Japanese, each with a coloured title tab; text shrinks together until both fit
  y += 44;
  const BOTTOM = PY0 + PH - 210;
  const pad = 30, TAB = 46, GAP = 30;
  let en = 34, ja = 29, enLines, jaLines, hEn, hJa;
  for (;;) {
    ctx.font = `400 ${en}px ${gothic}`; enLines = wrapLines(ctx, e.lead, CW - pad * 2);
    ctx.font = `400 ${ja}px ${gothic}`; jaLines = wrapLines(ctx, e.leadJa, CW - pad * 2);
    hEn = TAB + pad * 0.8 + enLines.length * en * 1.6 + pad * 0.6;
    hJa = TAB + pad * 0.8 + jaLines.length * ja * 1.75 + pad * 0.6;
    if (y + hEn + GAP + hJa <= BOTTOM || en <= 17) break;
    en -= 1; ja = Math.max(15, ja - 1);
  }
  const box = (top, h, label, lines, size, lh, color) => {
    ctx.save(); shadow(14, 4, 0.08); ctx.fillStyle = '#ffffff'; rr(X, top, CW, h, 18); ctx.fill(); ctx.restore();
    ctx.strokeStyle = C.mid; ctx.lineWidth = 2; rr(X, top, CW, h, 18); ctx.stroke();
    ctx.save(); rr(X, top, CW, h, 18); ctx.clip(); ctx.fillStyle = C.pale; ctx.fillRect(X, top, CW, TAB); ctx.restore();
    ctx.fillStyle = C.mid; ctx.fillRect(X, top + TAB, CW, 2);
    ctx.fillStyle = C.deep; ctx.font = `700 38px ${botan}`; text(label, X + pad, top + 36);
    [0, 1, 2].forEach((i) => { ctx.fillStyle = [C.light, C.mid, C.deep][i]; ctx.beginPath(); ctx.arc(X + CW - pad - i * 22, top + TAB / 2, 6, 0, Math.PI * 2); ctx.fill(); });
    let ty = top + TAB + pad * 0.8 + size;
    ctx.fillStyle = color; ctx.font = `400 ${size}px ${gothic}`;
    lines.forEach((l) => { text(l, X + pad, ty); ty += size * lh; });
  };
  box(y, hEn, '✎ English', enLines, en, 1.6, C.body);
  box(y + hEn + GAP, hJa, '✎ 日本語', jaLines, ja, 1.75, C.body);

  // footer: a dashed rule, the note, and the mark again
  const FY = PY0 + PH - 70;
  ctx.strokeStyle = C.mid; ctx.lineWidth = 2; ctx.setLineDash([10, 9]); ctx.beginPath(); ctx.moveTo(X, FY - 112); ctx.lineTo(RIGHT, FY - 112); ctx.stroke(); ctx.setLineDash([]);
  const [editedEn, editedJa] = lastEdited();
  ctx.fillStyle = C.sub; ctx.font = `400 21px ${gothic}`;
  text(editedEn, X, FY - 72);
  text(editedJa, X, FY - 44);
  ctx.fillStyle = C.faint; ctx.font = `400 19px ${gothic}`;
  text('This article is a work of fiction.', X, FY - 8);
  text('この記事はフィクションです。', X, FY + 20);
  ctx.fillStyle = C.ink; ctx.font = `700 32px ${formal}`; text('yourwiki', RIGHT, FY + 8, 'right');
  const ww = ctx.measureText('yourwiki').width;
  ctx.fillStyle = C.deep; ctx.font = `700 40px "Dancing Script", cursive`; text('W', RIGHT - ww - 14, FY + 12, 'right');

  const url = canvas.toDataURL('image/png');
  CARD_LAYOUTS.set(url, lastCardLayout || CARD_PORTRAIT);
  return url;
}

const YEARS = Array.from({ length: 2030 - 1900 + 1 }, (_, i) => 1900 + i);
const DEFAULT_YEAR = '2009';
const ITEM_PX = 48; // matches .wheel-item height (3rem)

// Scroll-to-choose year picker: the row in the mint band is the chosen year.
function YearWheel({ value, onChange }) {
  const listRef = useRef(null);
  const timer = useRef(0);
  const [index, setIndex] = useState(Math.max(0, YEARS.indexOf(Number(value || DEFAULT_YEAR))));

  useEffect(() => {
    if (!value) onChange(DEFAULT_YEAR);
    listRef.current.scrollTop = index * ITEM_PX;
  }, []);

  const scrollToIndex = (i, smooth = true) => {
    const clamped = Math.min(YEARS.length - 1, Math.max(0, i));
    listRef.current.scrollTo({ top: clamped * ITEM_PX, behavior: smooth ? 'smooth' : 'auto' });
  };
  const onScroll = () => {
    const i = Math.min(YEARS.length - 1, Math.max(0, Math.round(listRef.current.scrollTop / ITEM_PX)));
    setIndex(i);
    window.clearTimeout(timer.current);
    timer.current = window.setTimeout(() => onChange(String(YEARS[i])), 80);
  };
  const onKeyDown = (event) => {
    if (event.key === 'ArrowUp') { event.preventDefault(); scrollToIndex(index - 1); }
    if (event.key === 'ArrowDown') { event.preventDefault(); scrollToIndex(index + 1); }
  };

  return html`
    <div className="flex items-center gap-3">
      <div className="wheel w-full">
        <div className="wheel-band"></div>
        <div ref=${listRef} className="wheel-list" tabIndex="0" role="listbox" aria-label="Year of birth" aria-activedescendant=${`year-${YEARS[index]}`} onScroll=${onScroll} onKeyDown=${onKeyDown}>
          ${YEARS.map((year, i) => html`
            <div key=${year} id=${`year-${year}`} role="option" aria-selected=${i === index} className=${`wheel-item ${i === index ? 'on' : ''}`} onClick=${() => scrollToIndex(i)}>${year}</div>`)}
        </div>
        <div className="wheel-fade"></div>
      </div>
      <div className="flex flex-col gap-2">
        <button type="button" className="btn-quiet !w-11 !p-0" aria-label="Earlier year" onClick=${() => scrollToIndex(index - 1)}><${ChevronUp} size=${20} /></button>
        <button type="button" className="btn-quiet !w-11 !p-0" aria-label="Later year" onClick=${() => scrollToIndex(index + 1)}><${ChevronDown} size=${20} /></button>
      </div>
    </div>`;
}

function Play({ data, setData, onComplete }) {
  const [step, setStep] = useState(0);
  const [error, setError] = useState(null);
  const update = (patch) => setData({ ...data, ...patch });
  const canNext = useMemo(() => {
    if (step === 0) return Boolean(data.name.trim());
    if (step === 1) return /^\d{4}$/.test(data.birthYear) && Number(data.birthYear) >= 1 && Number(data.birthYear) <= 2200;
    if (step === 3) return Boolean(data.birthplace.trim()) && (data.titles.length > 0 || Boolean(data.titleOther.trim()));
    if (step === 4) return (data.matters || []).length > 0 || Boolean(data.mattered.trim());
    if (step === 6) return Boolean((data.viewTopic || (data.viewTopicOther || '').trim()) && data.viewStance);
    if (step === 7) return Boolean(data.endWho.trim() && data.endCondition.trim() && data.endPlace.trim()) || Boolean(data.endOther.trim());
    return true;
  }, [data, step]);
  const next = () => {
    if (!canNext) {
      setError(step === 1 ? ['Please enter a four-digit year.', '4桁の生まれ年を入力してください。'] : ['Please answer before moving on.', '答えを入れてから進んでください。']);
      return;
    }

              ${i === 0
                ? html`<h1 className="display mt-3 text-3xl leading-tight text-ink md:text-5xl"><${Bi} pair=${part.title} jaClass="ja-lg mt-2" /></h1>`

              <p className="mt-4 text-base leading-7 text-body"><${Bi} pair=${part.hint} jaClass="mt-1" /></p>

          <div className="mt-12 flex items-center justify-between gap-3 border-t border-rule pt-5">

/* ---------- quiz: friends guess your answers ---------- */
// The whole quiz (questions, the article and its translations) is packed into the link itself, after #quiz=,
// compressed where the browser can. Nothing is stored anywhere, so no server or account is needed.
const b64url = (bytes) => btoa(String.fromCharCode(...bytes)).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
const unb64url = (t) => Uint8Array.from(atob(t.replace(/-/g, '+').replace(/_/g, '/') + '==='.slice((t.length + 3) % 4)), (c) => c.charCodeAt(0));
async function squeeze(bytes, mode) {
  const stream = new Blob([bytes]).stream().pipeThrough(mode === 'in' ? new CompressionStream('deflate-raw') : new DecompressionStream('deflate-raw'));
  return new Uint8Array(await new Response(stream).arrayBuffer());
}
async function packQuiz(quiz) {
  const raw = new TextEncoder().encode(JSON.stringify(quiz));
  if (typeof CompressionStream === 'function') { try { return 'z' + b64url(await squeeze(raw, 'in')); } catch { /* fall through */ } }
  return 'j' + b64url(raw);
}
async function unpackQuiz(code) {
  const bytes = unb64url(code.slice(1));
  return JSON.parse(new TextDecoder().decode(code[0] === 'z' ? await squeeze(bytes, 'out') : bytes));
}
const quizIdFromHash = () => { const m = /^#quiz=([zj][A-Za-z0-9_-]+)$/.exec(window.location.hash); return m ? m[1] : null; };

function shuffled(list, rand = Math.random) {
  const a = [...list];
  for (let i = a.length - 1; i > 0; i -= 1) { const j = Math.floor(rand() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}

// Builds the questions from the finished article, in a fixed order:
// birthplace, what mattered, belief, state at the end, with whom, where, last words (or occupation if none).
// Each: { topic: [en, ja], q: [en, ja], options: [[en, ja], …], answer: index }.
function buildQuiz(data) {
  const e = entryOf(data);
  const nm = [e.name, e.nameJa];
  const questions = [];
  const ask = (topic, q, correct, pool) => {
    const others = shuffled(pool.filter(([en, ja]) => en !== correct[0] && ja !== correct[1])).slice(0, 3);
    if (!others.length) return;
    const options = shuffled([correct, ...others]);
    questions.push({ topic, q, options, answer: options.indexOf(correct) });
  };
  const pairs = (list, en = (x) => x[0]) => list.map((x) => [en(x), x[1]]);
  const typed = (v) => [trEn(v.trim()), trJa(v.trim())];

  ask(['Birthplace', '生まれ'], [`Where was ${nm[0]} born?`, `${nm[1]}はどこで生まれた？`], [e.birthplace, e.birthplaceJa],
    [...pairs(placeShortcuts), ['Tokyo', '東京'], ['Osaka', '大阪'], ['Hokkaido', '北海道']]);
  const firstMatter = (data.matters || [])[0];
  const matterPair = firstMatter ? [articleEnOf(firstMatter), jaOf(firstMatter)] : data.mattered.trim() ? typed(data.mattered) : null;
  if (matterPair) ask(['What matters', '大切なこと'], [`What does ${nm[0]} hold on to in life?`, `${nm[1]}が大切にしていることは？`], matterPair, pairs(matteredOptions, (x) => x[2] || x[0]));
  if (data.viewStance && (data.viewTopic || data.viewTopicOther)) {
    const topic = data.viewTopic ? [articleEnOf(data.viewTopic), jaOf(data.viewTopic)] : typed(data.viewTopicOther);
    questions.push({ topic: ['Belief', '思想'], q: [`On ${topic[0]}, where does ${nm[0]} stand?`, `${topic[1]}について、${nm[1]}の立場は？`], options: [['For it', '賛成'], ['Against it', '反対']], answer: data.viewStance === 'for' ? 0 : 1 });
  }
  if (data.endCondition.trim()) ask(['In what state', '状態'], [`In what state does ${nm[0]} pass away?`, `${nm[1]}はどんな状態でこの世を去る？`], typed(data.endCondition),
    [...pairs(endConditionOptions), ['suddenly', '突然'], ['in their sleep', '眠るように']]);
  if (data.endWho.trim()) ask(['With whom', '誰と'], [`Who is with ${nm[0]} at the end?`, `${nm[1]}は誰とこの世を去る？`], typed(data.endWho),
    [...pairs(endWhoOptions), ['with friends', '友だちと'], ['surrounded by their dogs', '愛犬に囲まれて']]);
  if (data.endPlace.trim()) ask(['Where', 'どこで'], [`Where does ${nm[0]} pass away?`, `${nm[1]}はどこでこの世を去る？`], typed(data.endPlace),
    [...pairs(endPlaceOptions), ['in the town where they grew up', '生まれ育った街で']]);
  if ((data.lastWords || '').trim()) {
    ask(['Last words', '最期の言葉'], [`What are ${nm[0]}'s last words?`, `${nm[1]}の最期の言葉は？`], typed(data.lastWords.replace(/[.。]$/, '')),
      [['Thank you for loving me', '愛してくれてありがとう'], ['See you later', 'またね'], ['It was a good life', 'いい人生だった'], ['Don\u2019t forget to eat well', 'ちゃんとごはん食べてね']]);
  } else {
    ask(['Occupation', '肩書き'], [`What did ${nm[0]} do in life?`, `${nm[1]}は何をした人？`], [e.title, e.titleJa], pairs(titleOptions));
  }
  // the article itself travels with the quiz, with the translations of anything typed, so takers can read it at the end
  const translations = freeTextItems(data).filter((i) => TR_CACHE.has(i.text)).map((i) => [i.text, TR_CACHE.get(i.text).en, TR_CACHE.get(i.text).ja]);
  return { name: e.name, nameJa: e.nameJa, avatar: data.avatar, questions, article: data, translations, createdAt: new Date().toISOString() };
}

// A square picture of the quiz link as a QR code, to save to the camera roll and send; a phone camera
// or the Photos app opens the link straight from it.
async function renderQrPng(link, quizName, avatar) {
  const qr = qrcode(0, 'L');
  qr.addData(link);
  qr.make();
  const n = qr.getModuleCount();
  const S = 1080;
  const color = Number.isInteger(avatar) ? AV_COLORS[3] : pick(AV_COLORS, (avatar || {}).color);
  const deep = mixHex(color.fill, '#2f2e3c', 0.42), pale = mixHex(color.fill, '#ffffff', 0.82);
  const round = '"Zen Maru Gothic", "Hiragino Maru Gothic ProN", "Noto Sans CJK JP", sans-serif';
  try { await document.fonts.load(`700 40px "Zen Maru Gothic"`, `${quizName}How well do you know?のこと、どれだけ知ってる？Scan to play読み取ってクイズに挑戦`); } catch { /* system faces */ }
  const canvas = document.createElement('canvas'); canvas.width = S; canvas.height = S;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = pale; ctx.fillRect(0, 0, S, S);
  ctx.fillStyle = '#ffffff'; ctx.beginPath(); ctx.roundRect(60, 60, S - 120, S - 120, 36); ctx.fill();
  const portrait = new Image(); portrait.src = avatarUrl(avatar); await portrait.decode();
  ctx.save(); ctx.beginPath(); ctx.roundRect(110, 100, 150, 150, 18); ctx.clip(); ctx.drawImage(portrait, 110, 100, 150, 150); ctx.restore();
  ctx.fillStyle = '#2f2e3c'; ctx.textAlign = 'left';
  let size = 44; ctx.font = `700 ${size}px ${round}`;
  const title = `How well do you know ${quizName}?`;
  while (ctx.measureText(title).width > S - 400 && size > 26) { size -= 2; ctx.font = `700 ${size}px ${round}`; }
  ctx.fillText(title, 290, 168);
  ctx.fillStyle = '#6a6979'; ctx.font = `500 30px ${round}`; ctx.fillText(`${quizName}のこと、どれだけ知ってる？`, 290, 218);
  // the code itself, with a white quiet zone around it
  // whole-pixel cells keep the edges sharp, which cameras read more reliably
  const cell = Math.max(2, Math.floor(600 / n)), box = cell * n, x0 = Math.round((S - box) / 2), y0 = 280 + Math.round((600 - box) / 2);
  for (let r = 0; r < n; r += 1) for (let c = 0; c < n; c += 1) {
    if (qr.isDark(r, c)) { ctx.fillStyle = '#16161d'; ctx.fillRect(x0 + c * cell, y0 + r * cell, cell, cell); }
  }
  ctx.fillStyle = deep; ctx.textAlign = 'center'; ctx.font = `700 36px ${round}`; ctx.fillText('Scan to play  読み取ってクイズに挑戦', S / 2, 280 + 600 + 72);
  ctx.fillStyle = '#9896a4'; ctx.font = `700 28px "Shippori Mincho", serif`; ctx.fillText('yourwiki', S / 2, S - 78);
  return canvas.toDataURL('image/png');
}

// Builds the quiz link for this page: its own address with the packed quiz after #quiz=.
async function saveQuiz(data) {
  try {
    // only answers that were filled in, plus the translations of typed words; the quiz is rebuilt when opened
    const answers = Object.fromEntries(Object.entries(data).filter(([, v]) => (Array.isArray(v) ? v.length : v !== '' && v != null)));
    const translations = freeTextItems(data).filter((i) => TR_CACHE.has(i.text)).map((i) => [i.text, TR_CACHE.get(i.text).en, TR_CACHE.get(i.text).ja]);
    return `${window.location.href.split('#')[0]}#quiz=${await packQuiz({ v: 2, a: answers, t: translations })}`;
  } catch {
    throw ['The quiz could not be made.', 'クイズを作れませんでした。'];
  }
}

// A light-hearted line for each score (the bands are set for 7 questions and scale for fewer).
function quizComment(score, total) {
  if (score === total) return ['Wait, are you them?', '本人じゃん'];
  if (score === 0) return ['You met two seconds ago.', '出会って2秒'];
  const r = score / total;
  if (r >= 5 / 7) return ['Certified best friend.', '親友だね'];
  if (r >= 3 / 7) return ['Friends on the surface.', 'うわべだけの友達'];
  return ['Just acquaintances.', '知り合い程度'];
}

// A square image of someone's quiz result, to send back to the person the quiz is about.
async function renderQuizResultPng(quiz, picks, from) {
  const S = 1080, CX = S / 2;
  const color = Number.isInteger(quiz.avatar) ? AV_COLORS[3] : pick(AV_COLORS, (quiz.avatar || {}).color);
  const base = color.fill;
  const C = { desk: mixHex(base, '#f6f4f0', 0.86), page: '#fffefb', grid: mixHex(base, '#ffffff', 0.78), ink: '#2f2e3c', sub: '#6a6979',
    pale: mixHex(base, '#ffffff', 0.86), light: mixHex(base, '#ffffff', 0.68), mid: mixHex(base, '#ffffff', 0.42), deep: mixHex(base, '#2f2e3c', 0.42) };
  const round = '"Zen Maru Gothic", "Hiragino Maru Gothic ProN", "Noto Sans CJK JP", sans-serif';
  const formal = '"Shippori Mincho", "Hiragino Mincho ProN", "Noto Serif CJK JP", serif';
  const bubble = '"Cherry Bomb One", "Zen Maru Gothic", sans-serif';
  const botan = '"Amatic SC", "Zen Maru Gothic", cursive';
  const score = quiz.questions.reduce((n, q, i) => n + (picks[i] === q.answer ? 1 : 0), 0);
  const total = quiz.questions.length;
  const all = `${quiz.name}${quiz.nameJa}${from}クイズの結果正解問中 QUIZ RESULT yourwiki from ${quiz.questions.map((q) => q.topic.join('')).join('')}`;
  try { await Promise.all([document.fonts.load(`700 40px "Zen Maru Gothic"`, all), document.fonts.load(`400 120px "Cherry Bomb One"`, `0123456789/ ${quiz.name}`), document.fonts.load(`700 40px "Amatic SC"`, 'QUIZ RESULT'), document.fonts.load(`700 40px "Shippori Mincho"`, 'yourwiki')]); } catch { /* system faces */ }
  const canvas = document.createElement('canvas'); canvas.width = S; canvas.height = S;
  const ctx = canvas.getContext('2d');
  const rr = (x, y, w, h, r) => { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); };
  const text = (t, x, y, align = 'left') => { ctx.textAlign = align; ctx.fillText(t, x, y); ctx.textAlign = 'left'; };
  const fit = (t, weight, size, family, maxW, min) => { let s = size; for (;;) { ctx.font = `${weight} ${s}px ${family}`; if (ctx.measureText(t).width <= maxW || s <= min) return s; s -= 2; } };

  ctx.fillStyle = C.desk; ctx.fillRect(0, 0, S, S);
  const PX0 = 56, PY0 = 56, PW = S - 112, PH = S - 112;
  ctx.save(); ctx.shadowColor = 'rgba(47,46,60,.16)'; ctx.shadowBlur = 36; ctx.shadowOffsetY = 14; ctx.fillStyle = C.page; rr(PX0, PY0, PW, PH, 22); ctx.fill(); ctx.restore();
  ctx.save(); rr(PX0, PY0, PW, PH, 22); ctx.clip(); ctx.strokeStyle = C.grid; ctx.lineWidth = 1.4;
  for (let x = PX0 + 17; x < PX0 + PW; x += 34) { ctx.beginPath(); ctx.moveTo(x, PY0); ctx.lineTo(x, PY0 + PH); ctx.stroke(); }
  for (let y = PY0 + 17; y < PY0 + PH; y += 34) { ctx.beginPath(); ctx.moveTo(PX0, y); ctx.lineTo(PX0 + PW, y); ctx.stroke(); }
  ctx.restore();
  // washi tape
  [[PX0 + 60, PY0 + 4, -30, C.light], [PX0 + 70, PY0 + PH - 6, 30, C.mid]].forEach(([x, y, a, col]) => {
    ctx.save(); ctx.translate(x, y); ctx.rotate(a * Math.PI / 180); ctx.globalAlpha = 0.8; ctx.fillStyle = col; ctx.fillRect(-100, -24, 200, 48); ctx.restore();
  });
  const X = PX0 + 70, RIGHT = PX0 + PW - 70;
  // header
  ctx.fillStyle = C.deep; ctx.font = `700 48px "Dancing Script", cursive`; text('W', X, PY0 + 96);
  ctx.fillStyle = C.ink; ctx.font = `700 36px ${formal}`; text('yourwiki', X + 60, PY0 + 92);
  ctx.font = `700 38px ${botan}`; const pill = 'QUIZ RESULT'; const pw = ctx.measureText(pill).width + 44;
  ctx.fillStyle = C.light; rr(RIGHT - pw, PY0 + 54, pw, 50, 25); ctx.fill(); ctx.fillStyle = C.deep; text(pill, RIGHT - pw / 2, PY0 + 90, 'center');
  ctx.fillStyle = C.mid; ctx.fillRect(X, PY0 + 124, RIGHT - X, 2);

  // portrait and title
  const portrait = new Image(); portrait.src = avatarUrl(quiz.avatar); await portrait.decode();
  ctx.save(); ctx.shadowColor = 'rgba(47,46,60,.16)'; ctx.shadowBlur = 18; ctx.shadowOffsetY = 6; ctx.fillStyle = '#ffffff'; rr(X - 10, PY0 + 160, 220, 220, 14); ctx.fill(); ctx.restore();
  ctx.save(); rr(X, PY0 + 170, 200, 200, 8); ctx.clip(); ctx.drawImage(portrait, X, PY0 + 170, 200, 200); ctx.restore();
  const TX = X + 250, TW = RIGHT - TX;
  ctx.fillStyle = C.sub; ctx.font = `500 30px ${round}`; text('How well do you know', TX, PY0 + 210);
  const ns = fit(quiz.name, 400, 76, bubble, TW, 40);
  ctx.fillStyle = mixHex(base, '#2f2e3c', color.dark ? 0.05 : 0.3); text(`${quiz.name}?`, TX, PY0 + 210 + ns * 1.05);
  ctx.fillStyle = C.sub; ctx.font = `500 30px ${round}`; text(`${quiz.nameJa}クイズの結果`, TX, PY0 + 210 + ns * 1.05 + 52);
  // score, with a one-line comment under it
  const SY = PY0 + 492;
  ctx.fillStyle = C.pale; rr(X, SY - 92, RIGHT - X, 128, 64); ctx.fill();
  ctx.fillStyle = C.deep; ctx.font = `400 104px ${bubble}`; text(`${score} / ${total}`, CX - 40, SY + 10, 'center');
  ctx.font = `700 34px ${round}`; text(score === total ? '全問正解！' : `${total}問中${score}問正解`, CX + 200, SY - 4, 'center');
  const [commentEn, commentJa] = quizComment(score, total);
  ctx.fillStyle = C.ink; ctx.font = `700 30px ${round}`; text(commentJa, CX, SY + 86, 'center');
  ctx.fillStyle = C.sub; ctx.font = `500 22px ${round}`; text(commentEn, CX, SY + 120, 'center');

  // each question: ✓ or ✗ with its topic, in two columns
  const rowsTop = SY + 152, colW = (RIGHT - X - 30) / 2;
  quiz.questions.forEach((q, i) => {
    const col = i < 4 ? 0 : 1, row = i < 4 ? i : i - 4;
    const x = X + col * (colW + 30), y = rowsTop + row * 70;
    const ok = picks[i] === q.answer;
    ctx.fillStyle = '#ffffff'; ctx.strokeStyle = C.mid; ctx.lineWidth = 2; rr(x, y, colW, 56, 28); ctx.fill(); ctx.stroke();
    ctx.fillStyle = ok ? '#2f7d6a' : '#d2473f'; ctx.beginPath(); ctx.arc(x + 30, y + 28, 18, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 4; ctx.lineCap = 'round'; ctx.beginPath();
    if (ok) { ctx.moveTo(x + 21, y + 28); ctx.lineTo(x + 28, y + 35); ctx.lineTo(x + 40, y + 21); } else { ctx.moveTo(x + 23, y + 21); ctx.lineTo(x + 37, y + 35); ctx.moveTo(x + 37, y + 21); ctx.lineTo(x + 23, y + 35); }
    ctx.stroke();
    ctx.fillStyle = C.ink; ctx.font = `700 26px ${round}`; text(`Q${i + 1}  ${q.topic[1]}`, x + 62, y + 37);
    const jaW = ctx.measureText(`Q${i + 1}  ${q.topic[1]}`).width;
    ctx.fillStyle = C.sub; ctx.font = `500 20px ${round}`;
    if (62 + jaW + 16 + ctx.measureText(q.topic[0]).width <= colW - 22) text(q.topic[0], x + colW - 22, y + 36, 'right');
  });

  // who answered, bottom right
  if (from) {
    const fy = PY0 + PH - 34;
    ctx.font = `700 26px ${round}`; const label = `Answered by ${from}`; const lw = ctx.measureText(label).width + 36;
    ctx.font = `500 22px ${round}`; const ja = `${from}さんの回答`; const jw = ctx.measureText(ja).width;
    ctx.fillStyle = C.sub; text(ja, RIGHT, fy - 2, 'right');
    ctx.fillStyle = C.light; rr(RIGHT - jw - 14 - lw, fy - 32, lw, 44, 22); ctx.fill();
    ctx.fillStyle = C.deep; ctx.font = `700 26px ${round}`; text(label, RIGHT - jw - 14 - lw + 18, fy);
  }
  return canvas.toDataURL('image/png');
}

// Hands a PNG data URL to the viewer: the share sheet on phones (LINE, AirDrop, Messages…), a download elsewhere.
// Resolves false only when neither worked, so the caller can show the image to press and hold.
async function savePng(dataUrl, filename) {
  const name = filename.replace(/[\\/:*?"<>|]+/g, '').trim() || 'yourwiki.png';
  const bin = atob(dataUrl.split(',')[1]);
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i += 1) bytes[i] = bin.charCodeAt(i);
  const file = new File([bytes], name, { type: 'image/png' });
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    try { await navigator.share({ files: [file], title: 'yourwiki' }); return true; }
    catch (err) { if (err?.name === 'AbortError') return true; }
  }
  try {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(file); a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    window.setTimeout(() => URL.revokeObjectURL(a.href), 4000);
    return !/iPhone|iPad|iPod/.test(navigator.userAgent); // iOS without sharing: show the image instead
  } catch { return false; }
}

function QuizPage({ quizId }) {
  const go = useContext(NavContext);
  const [quiz, setQuiz] = useState(undefined); // undefined: loading, null: not found
  const [picks, setPicks] = useState([]);
  const [index, setIndex] = useState(0);
  const [from, setFrom] = useState('');
  const [image, setImage] = useState(null); // the result card, shown on the result screen and saved as is
  const [zoom, setZoom] = useState(false);
  const [articleOpen, setArticleOpen] = useState(false);
  useEffect(() => {
    let live = true;
    const timer = window.setTimeout(() => { if (live) setQuiz(null); }, 10000);
    (async () => {
      try {
        let body = await unpackQuiz(quizId);
        if (body && body.v === 2) {
          (body.t || []).forEach(([text, en, ja]) => { if (text && en && ja && !TR_CACHE.has(text)) TR_CACHE.set(text, { en, ja }); });
          body = buildQuiz({ ...defaultWiki, ...body.a });
        }
        if (body && Array.isArray(body.translations)) body.translations.forEach(([text, en, ja]) => { if (text && en && ja && !TR_CACHE.has(text)) TR_CACHE.set(text, { en, ja }); });
        if (live) setQuiz(body && Array.isArray(body.questions) && body.questions.length ? body : null);
      } catch { if (live) setQuiz(null); }
      window.clearTimeout(timer);
    })();
    return () => { live = false; window.clearTimeout(timer); };
  }, [quizId]);
  const leave = () => { window.location.hash = ''; go('landing'); };

  if (quiz === undefined) return html`<${PageShell}><main className="mx-auto max-w-xl px-5 py-20 text-center text-sub" role="status"><${Bi} pair=${['Loading the quiz…', 'クイズを読み込んでいます…']} /></main><//>`;
  if (quiz === null) return html`<${PageShell}><main className="mx-auto max-w-xl px-5 py-20 text-center">
    <p className="text-lg font-bold text-ink"><${Bi} pair=${['This quiz could not be found.', 'クイズが見つかりませんでした。']} /></p>
    <button type="button" className="btn mt-8" onClick=${leave}>Make your own article <span lang="ja" className="ml-1 text-sm font-normal">自分の記事を作る</span></button>
  </main><//>`;

  const total = quiz.questions.length;
  // screens: the questions (0 … total-1), then the taker's name (total), then the result (total + 1)
  const askingName = index === total;
  const done = index > total;
  const q = quiz.questions[Math.min(index, total - 1)];
  const picked = picks[index] ?? null;
  const score = quiz.questions.reduce((n, qq, i) => n + (picks[i] === qq.answer ? 1 : 0), 0);
  const choose = (i) => { if (picked !== null) return; const next = [...picks]; next[index] = i; setPicks(next); };
  const showResult = async () => {
    setIndex(total + 1);
    setImage(null);
    try { setImage(await renderQuizResultPng(quiz, picks, from.trim())); } catch { setImage(''); }
  };
  const sendBack = async () => {
    if (!image) return;
    const saved = await savePng(image, `yourwiki-quiz-${quiz.name}.png`);
    if (!saved) setZoom(true);
  };

  return html`
    <${PageShell}>
      <main className="mx-auto max-w-xl px-5 pb-20 pt-8 md:pt-10">
        <div className="flex items-center gap-4">
          <img src=${avatarUrl(quiz.avatar, true, 'quiz')} alt="" className="h-20 w-20 rounded-xl border border-rule" />
          <div>
            <p className="label text-mint-ink">Quiz <span lang="ja" className="ml-1 font-normal">クイズ</span></p>
            <h1 className="display mt-1 text-2xl leading-tight text-ink"><${Bi} pair=${[`How well do you know ${quiz.name}?`, `${quiz.nameJa}のこと、どれだけ知ってる？`]} jaClass="ja-lg mt-1" /></h1>
          </div>
        </div>
        ${done
          ? html`<div className="mt-8 text-center">
              ${image
                ? html`<img src=${image} alt=${`Quiz result: ${score} of ${total}`} className="w-full rounded-2xl shadow-[0_24px_50px_-24px_rgba(38,39,65,.45)]" />`
                : html`<div className="aspect-square w-full animate-pulse rounded-2xl bg-mint-soft" role="status" aria-label="Making the result"></div>`}
              <p className="mt-5 text-sm leading-6 text-sub"><${Bi} pair=${['Why not talk about the answers together?', '答えについて、一緒に話してみませんか？']} /></p>
              ${quiz.article && html`<button type="button" className="btn-outline mt-5 w-full" onClick=${() => setArticleOpen(true)}><span className="flex flex-col items-center leading-tight"><span>Read the original article</span><span lang="ja" className="mt-1 text-sm font-normal">もとの記事を読む</span></span></button>`}
              <button type="button" className="btn mt-3 w-full" onClick=${sendBack} disabled=${!image}><${Share2} size=${18} /> <span className="flex flex-col items-center leading-tight"><span>Send your result back</span><span lang="ja" className="mt-1 text-sm font-normal">結果を画像にして本人に送る</span></span></button>
              <button type="button" className="btn-quiet mt-4" onClick=${leave}>Make your own article <span lang="ja" className="ml-1 text-sm font-normal">自分の記事を作る</span></button>
            </div>`
          : askingName
          ? html`<div className="mt-10">
              <p className="num text-sm text-faint">Q${total + 1} / ${total + 1}</p>
              <h2 className="mt-2 text-xl font-bold leading-snug text-ink"><${Bi} pair=${['Last one: what is your name?', '最後に、あなたの名前は？']} jaClass="mt-1 text-base font-normal" /></h2>
              <p className="mt-2 text-sm leading-6 text-sub"><${Bi} pair=${['It goes on your result card. It can be made up.', '結果カードに載ります。架空でもかまいません。']} /></p>
              <input id="quizFrom" className="input-paper mt-5" value=${from} onChange=${(e) => setFrom(e.target.value)} maxLength=${20} placeholder="e.g. Ken　例：けん" />
              <div className="mt-4 flex flex-wrap gap-2">${[['Sakamoto Ryoma', '坂本龍馬'], ['Cleopatra', 'クレオパトラ']].map((pair) => html`<${Chip} key=${pair[0]} pair=${pair} selected=${from === pair[0]} onClick=${() => setFrom(from === pair[0] ? '' : pair[0])} />`)}</div>
              <div className="mt-6 text-right"><button type="button" className="btn" onClick=${showResult}>See your result <span lang="ja" className="ml-1 text-sm font-normal">結果を見る</span> <${ArrowRight} size=${18} /></button></div>
            </div>`
          : html`<div className="mt-10" key=${index}>
              <p className="num text-sm text-faint">Q${index + 1} / ${total}</p>
              <h2 className="mt-2 text-xl font-bold leading-snug text-ink"><${Bi} pair=${q.q} jaClass="mt-1 text-base font-normal" /></h2>
              <div className="mt-6 grid gap-3">
                ${q.options.map((o, i) => {
                  const right = picked !== null && i === q.answer;
                  const wrong = picked !== null && i === picked && i !== q.answer;
                  const state = right ? 'border-2 border-mint-ink bg-mint-soft' : wrong ? 'border-2 border-[#d2473f] bg-[#fbeceb]' : `border border-rule bg-white ${picked !== null ? 'opacity-60' : ''}`;
                  return html`<button key=${i} type="button" className=${`rounded-xl px-5 py-4 text-left text-base text-ink ${state}`} onClick=${() => choose(i)} disabled=${picked !== null}>
                    ${o[0]}<span lang="ja" className="ja mt-0.5 block text-sm text-sub">${o[1]}</span>
                    ${right ? html`<span className="mt-1 block text-sm font-bold text-mint-ink">✓ Correct 正解</span>` : ''}
                    ${wrong ? html`<span className="mt-1 block text-sm font-bold text-[#d2473f]">✗ Your answer あなたの答え</span>` : ''}
                  </button>`;
                })}
              </div>
              ${picked !== null && html`<div className="mt-6 text-right"><button type="button" className="btn" onClick=${() => setIndex((n) => n + 1)}>Next <${ArrowRight} size=${18} /></button></div>`}
            </div>`}
        ${articleOpen && quiz.article && html`
          <div className="fixed inset-0 z-40 overflow-y-auto bg-ink/80 p-5" role="dialog" aria-label="The original article" onClick=${() => setArticleOpen(false)}>
            <div className="mx-auto flex w-full max-w-sm flex-col items-center gap-4 py-4" onClick=${(e) => e.stopPropagation()}>
              <${LiveCard} data=${quiz.article} spot="quiz-article" />
              <button type="button" className="btn-outline" onClick=${() => setArticleOpen(false)}><${X} size=${18} /> Close</button>
            </div>
          </div>`}
        ${zoom && image && html`
          <div className="fixed inset-0 z-40 flex items-center justify-center bg-ink/80 p-5" role="dialog" aria-label="Result image" onClick=${() => setZoom(false)}>
            <div className="flex w-full max-w-md flex-col items-center gap-4" onClick=${(e) => e.stopPropagation()}>
              <img src=${image} alt="Quiz result" className="w-full rounded-xl shadow-xl" />
              <p className="text-center text-base font-bold text-white"><${Bi} pair=${['Press and hold the image, or right-click it, to save.', '画像を長押し、または右クリックして保存してください。']} jaClass="!text-[#e6e6ee]" /></p>
              <button type="button" className="btn-outline" onClick=${() => setZoom(false)}><${X} size=${18} /> Close</button>
            </div>
          </div>`}
      </main>
    <//>`;
}

/* ---------- app ---------- */

function App() {
  // A #quiz-… link opens straight onto that quiz.
  const [quizId, setQuizId] = useState(quizIdFromHash);
  const [page, setPage] = useState(() => (quizIdFromHash() ? 'quiz' : 'landing'));
  useEffect(() => {
    const onHash = () => { const id = quizIdFromHash(); if (id) { setQuizId(id); setPage('quiz'); } };
    window.addEventListener('hashchange', onHash);
    return () => window.removeEventListener('hashchange', onHash);
  }, []);
  const [data, setData] = useState(defaultWiki);
  const go = (to) => { setPage(to); window.scrollTo(0, 0); };
  let view;
  if (page === 'quiz' && quizId) view = html`<${QuizPage} quizId=${quizId} />`;
  else if (page === 'about') view = html`<${About} />`;
  else if (page === 'play') view = html`<${Play} data=${data} setData=${setData} onComplete=${() => go('result')} />`;
  else if (page === 'result') view = html`<${Result} data=${data} onEdit=${() => go('play')} />`;
  else view = html`<${Landing} />`;
  return html`<${NavContext.Provider} value=${go}>${view}<//>`;
}

ReactDOM.createRoot(document.getElementById('root')).render(html`<${App} />`);
</script>
